<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ဝင်ငွေ/ထွက်ငွေ စာရင်းစာအုပ်</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="login-section" class="card" style="display: block;">
            <h2>🔐 စနစ်အတွင်းသို့ ဝင်ရောက်ရန်</h2>
            <form id="login-form" onsubmit="event.preventDefault(); loginUser();">
                <input type="tel" id="user-phone" placeholder="ဖုန်းနံပါတ် ရိုက်ထည့်ပါ" required autocomplete="username">
                <input type="password" id="user-password" placeholder="ဝင်ခွင့်ကုဒ် (Password) ရိုက်ထည့်ပါ" style="margin-top: 10px;" required autocomplete="current-password">
                <button type="submit" id="login-btn" style="margin-top: 15px; background: #3498db;">🔐 အကောင့်ဝင်မည်</button>
            </form>
        </div>

        <div id="main-app" style="display: none;">
            <div class="user-bar">
                <span id="active-user-display">📱 Loading...</span>
                <button onclick="logoutUser()" style="background:#e74c3c; padding: 5px 10px; font-size:12px;">ထွက်မည် 🏃</button>
            </div>

            <div class="card balance-card">
                <h3>💰 စုစုပေါင်းလက်ကျန်</h3>
                <h1 id="net-balance">0 ကျပ်</h1>
                <div class="balance-row">
                    <div>🔺 ဝင်ငွေစုစုပေါင်း:<br><span id="total-income" class="text-inc">0 ကျပ်</span></div>
                    <div>🔻 ထွက်ငွေစုစုပေါင်း:<br><span id="total-expense" class="text-exp">0 ကျပ်</span></div>
                </div>
                <div class="balance-row" style="margin-top: 10px; border-top: 1px dashed #ddd; padding-top: 10px;">
                    <div>🏦 ဘဏ်လက်ကျန်:<br><span id="banking-balance" style="color:#3498db;">0 ကျပ်</span></div>
                    <div>💵 လက်ငင်းလက်ကျန်:<br><span id="cash-balance" style="color:#f39c12;">0 ကျပ်</span></div>
                </div>
            </div>

            <div class="card form-card">
                <h3>📝 စာရင်းအသစ်ထည့်ရန်</h3>
                <input type="number" id="amount" placeholder="ပမာဏ (ကျပ်)" inputmode="numeric" required>
                <input type="text" id="description" placeholder="အကြောင်းအရာ" required>
                <select id="method" onchange="toggleBankNameInput()">
                    <option value="Banking">🏦 Banking (ဘဏ် / Kpay)</option>
                    <option value="Cash">💵 Cash (လက်ငင်းငွေသား)</option>
                </select>
                <select id="bank-select" onchange="toggleCustomBankInput()">
                    <option value="Kpay">KBZ Pay</option>
                    <option value="Wavepay">Wave Pay</option>
                    <option value="AYAPay">AYA Pay</option>
                    <option value="CBPay">CB Pay</option>
                    <option value="KBZ Bank">KBZ Bank</option>
                    <option value="CB Bank">CB Bank</option>
                    <option value="Other">အခြားဘဏ်နာမည် ရေးမည်...</option>
                </select>
                <input type="text" id="custom-bank-name" placeholder="ဘဏ်နာမည် ရိုက်ထည့်ပါ" style="display: none; margin-top: 10px;">
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button onclick="addTransaction('ဝင်ငွေ')" style="background: #27ae60; flex: 1;">➕ ဝင်ငွေထည့်မည်</button>
                    <button onclick="addTransaction('ထွက်ငွေ')" style="background: #e74c3c; flex: 1;">➖ ထွက်ငွေထည့်မည်</button>
                </div>
            </div>

            <div class="card">
                <h3>📋 စာရင်းမှတ်တမ်းများ</h3>
                <ul id="transaction-list" class="tx-list"></ul>
            </div>
        </div> 
    </div> 

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="transactions.js"></script>
    <script src="ui.js"></script>
</body>
</html>
